<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plugin</title>
    <!--
      Load the entry point as a Vite module script.
      In debug builds, the Vite dev server serves the .ts file directly.
      In release builds, it is compiled into a bundled JS file.
    -->
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <main class="panel">
        <div class="header">
          <button class="plugin-name" id="plugin-name" type="button"></button>
          <button
            class="header-action"
            id="header-action"
            type="button"
          ></button>
        </div>
        <section class="page is-active" id="page-controls">
          <div class="synth-surface">
            <div class="gain-strip">
              <button class="value" id="gain-db" type="button">0.0 dB</button>
              <input
                class="value value-input"
                id="gain-input"
                type="text"
                hidden
              />
              <input
                class="gain-slider"
                id="gain-slider"
                type="range"
                min="0"
                max="2"
                step="0.001"
                aria-label="Output level"
              />
            </div>
            <div class="keyboard" aria-label="One octave keyboard">
              <button class="key white" type="button" data-note="C">C</button>
              <button class="key black cs" type="button" data-note="C#"></button>
              <button class="key white" type="button" data-note="D">D</button>
              <button class="key black ds" type="button" data-note="D#"></button>
              <button class="key white" type="button" data-note="E">E</button>
              <button class="key white" type="button" data-note="F">F</button>
              <button class="key black fs" type="button" data-note="F#"></button>
              <button class="key white" type="button" data-note="G">G</button>
              <button class="key black gs" type="button" data-note="G#"></button>
              <button class="key white" type="button" data-note="A">A</button>
              <button class="key black as" type="button" data-note="A#"></button>
              <button class="key white" type="button" data-note="B">B</button>
            </div>
          </div>
        </section>
        <section class="page about-page" id="page-about" hidden>
          <h1 class="about-title" id="about-title"></h1>
          <dl>
            <div>
              <dt>Plugin Name</dt>
              <dd id="about-plugin-name"></dd>
            </div>
            <div>
              <dt>Version</dt>
              <dd id="about-version"></dd>
            </div>
            <div>
              <dt>Company Name</dt>
              <dd id="about-company-name"></dd>
            </div>
            <div>
              <dt>Build</dt>
              <dd id="about-build"></dd>
            </div>
          </dl>
        </section>
      </main>
      <button
        class="resize-grip"
        id="resize-grip"
        type="button"
        aria-label="Resize plugin window"
      >
        <svg width="18" height="18" viewBox="0 0 12 12" aria-hidden="true">
          <path
            d="M2 10L10 2M5 10L10 5M8 10L10 8"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </body>
</html>
